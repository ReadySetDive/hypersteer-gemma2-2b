# @package _global_
# HyperSteer experiment - only overrides what's different from base

defaults:
  - base # Inherit from base experiment
  - override /model: hypersteer
  - override /inference: hypersteer
  - override /evaluate: hypersteer
  - override /train: hypersteer
  - _self_

# Global debug mode
debug: false

train:
  lr: 8e-5
  epochs: 3
  batch_size: 4
  test_batch_size: 4
  gradient_accumulation_steps: 1
  n_steps: -1
  val_interval: 100
  checkpoint_per_step: null
  max_grad_norm: 10.0

model:
  use_selection_head: false
  hypernet_type: "attn"
  cross_attn_hidden_layers: 8

  mask_visualization:
    log_heatmap: false
    log_heatmap_freq: 10
    pdf_visualization: false
    png_visualization: false
    log_all_examples: true

wandb:
  project: "hypersteer"
