defaults:
  - _self_

# Training procedure
batch_size: 16
test_batch_size: 8
gradient_accumulation_steps: 1
n_epochs: 3
n_steps: -1
val_interval: 100
checkpoint_per_step: null

# Optimization parameters
lr: 8e-5
warmup_steps: 0
weight_decay: 0.0
optimizer: "adamw"
max_grad_norm: 1.0

# Data configuration
binarize_dataset: false
train_on_negative: false
negative_example_ratio: 1.0

# Training environment
debug_model: false
save_dir: "assets/checkpoints"
resume_from: null
seed: 42
use_bf16: true
run_eval_suite_at_end: false 